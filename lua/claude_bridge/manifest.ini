[ABOUT]
NAME = Claude Bridge
AUTHOR = Robert K
VERSION = 0.1.0
DESCRIPTION = File-based remote control bridge (camera, time, screenshots, state) for external tools such as the ac-mcp-bridge MCP server. Inert until commands arrive.

[CORE]
LAZY = NONE  ; load with AC and keep running, so commands can arrive without opening a window

[UI_CALLBACKS]
IN_GAME = fullscreenUI

[WINDOW_...]
ID = main
NAME = Claude Bridge
FUNCTION_MAIN = windowMain
SIZE = 360, 180
