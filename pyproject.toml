[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assetto-corsa-mcp"
version = "0.1.0"
description = "MCP server + CSP Lua app to control Assetto Corsa (camera, time, screenshots, launch/quit)"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
dependencies = ["mcp>=1.2"]

[project.scripts]
ac-mcp-server = "ac_mcp.server:main"

[tool.setuptools]
packages = ["ac_mcp"]
